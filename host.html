
<!DOCTYPE html>
<html lang="ms">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>QUIZ LIVE PPAPP — Paparan Hos</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      padding: 24px;
      background: #080d1c;
      color: #fff;
      font-family: Arial, sans-serif;
    }
    header {
      max-width: 1100px;
      margin: 0 auto 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      flex-wrap: wrap;
    }
    .brand { font-weight: 900; letter-spacing: 1px; }
    .sub { color: #a5b4fc; font-size: 13px; margin-top: 6px; }
    a {
      color: white;
      text-decoration: none;
      background: #29334d;
      padding: 12px 16px;
      border-radius: 10px;
    }
    #hostLiveQuestionPanel {
      max-width: 1100px;
      margin: 24px auto;
      padding: clamp(18px, 3vw, 36px);
      border-radius: 24px;
      background: #111827;
      box-shadow: 0 16px 40px rgba(0,0,0,.25);
    }
    #hostLiveQuestionPanel:empty::after {
      content: "Menunggu soalan kuiz dimuatkan…";
      display: block;
      padding: 50px 10px;
      text-align: center;
      color: #cbd5e1;
      font-weight: 700;
    }
    #hostLiveQuestionPanel[hidden] { display: none; }
    #hostPageMsg {
      max-width: 1100px;
      margin: 18px auto;
      color: #cbd5e1;
      text-align: center;
    }
  </style>
</head>
<body>
  <header>
    <div>
      <div class="brand">QUIZ LIVE PPAPP</div>
      <div class="sub">PAPARAN HOS · KUIZ LANGSUNG</div>
    </div>
    <a href="admin.html">← Kembali ke Panel Admin</a>
  </header>

  <p id="hostPageMsg">Menyambungkan paparan hos…</p>
  <section id="hostLiveQuestionPanel"></section>

  <script src="app.js"></script>
</body>
</html>
